# Runs on every push and pull request: backend tests, then a frontend type check
# and production build (the same build Vercel runs).
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # runs the TypeScript unit tests directly
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen   # creates LayoutProps etc., which tsc needs on a fresh checkout
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npx next build

  # The whole app in a real browser: plan a demo trip, day vs night, simulated ride, reroute.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx next build
        working-directory: frontend
      - name: Start backend and frontend
        run: |
          (cd backend && python -m uvicorn main:app --port 8000 > ../backend.log 2>&1 &)
          (cd frontend && npx next start -p 3000 > ../frontend.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health && curl -sf -o /dev/null localhost:3000 && exit 0
            sleep 2
          done
          cat backend.log frontend.log; exit 1
      - run: npm run e2e
        working-directory: frontend
        env:
          CHROME: google-chrome
          SHOTS: ${{ github.workspace }}/e2e-screenshots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e-screenshots
            backend.log
            frontend.log
